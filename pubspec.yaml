name: bc_ui
description: "A Flutter design system porting heroui-native 1:1 — 60+ token-driven components, light and dark, on a Material 3 base."
version: 0.4.3
repository: https://github.com/binary-castle/bc-ui-flutter
issue_tracker: https://github.com/binary-castle/bc-ui-flutter/issues

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # libPhoneNumber metadata in pure Dart — parsing, validation and national
  # formatting for BCPhoneField. No platform channels, and its own only
  # dependency is `meta`.
  phone_numbers_parser: ^9.0.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
